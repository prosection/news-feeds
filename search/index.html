<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>検索 — AI・ガジェット・カメラ ニュース</title>
  <style>
:root { --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#9aa7b8; --accent:#5b9dff; --border:#2a3548; }
* { box-sizing: border-box; }
body { margin:0; font-family: "Hiragino Sans","Noto Sans JP",system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
header { padding:2rem 1.25rem 1rem; max-width:880px; margin:0 auto; }
header h1 { font-size:1.55rem; margin:0 0 .5rem; }
header p { color:var(--muted); margin:.35rem 0; }
.counts { margin-top:.6rem !important; }
.counts span { display:inline-block; background:#243044; color:var(--accent); padding:.15rem .55rem; border-radius:999px; font-size:.78rem; margin:.15rem .35rem .15rem 0; }
nav { max-width:880px; margin:0 auto; padding:0 1.25rem 1rem; }
nav a { color:var(--accent); margin-right:1rem; }
main { max-width:880px; margin:0 auto; padding:0 1.25rem 3rem; }
.hint { color:var(--muted); font-size:.88rem; margin:0 0 1rem; }
details.item {
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  margin:.7rem 0; overflow:hidden;
}
details.item > summary {
  list-style:none; cursor:pointer; padding:1rem 1.2rem;
  display:grid; gap:.45rem;
  -webkit-tap-highlight-color: transparent;
}
details.item > summary::-webkit-details-marker { display:none; }
details.item > summary::marker { content:""; }
.item-title {
  display:flex; align-items:flex-start; gap:.65rem;
  font-size:1.05rem; font-weight:600; line-height:1.45; margin:0;
}
.chev {
  flex:0 0 auto; width:1.1rem; color:var(--accent); margin-top:.15rem;
  transition: transform .15s ease; font-size:1rem; line-height:1;
}
details.item[open] .chev { transform: rotate(90deg); }
.meta { color:var(--muted); font-size:.88rem; }
.meta a { color:var(--accent); word-break:break-all; }
.tag { display:inline-block; background:#243044; color:var(--accent); padding:.15rem .55rem; border-radius:999px; font-size:.78rem; margin-right:.4rem; }
.summary { color:#c5d0de; font-size:.92rem; margin:0; font-weight:400; }
.body { padding:0 1.2rem 1.15rem; border-top:1px solid var(--border); }
.body p { margin:.65rem 0; }
.body h3 { font-size:1rem; margin:1rem 0 .4rem; }
.body a { color:var(--accent); word-break:break-all; }
footer { max-width:880px; margin:0 auto; padding:1rem 1.25rem 3rem; color:var(--muted); font-size:.85rem; }
footer a { color:var(--accent); }
@media (max-width:560px) {
  header h1 { font-size:1.3rem; }
  .item-title { font-size:.98rem; }
  details.item > summary { padding:.9rem 1rem; }
  .body { padding:0 1rem 1rem; }
}
  
.datehead { font-size:1rem; color:var(--muted); margin:1.6rem 0 .3rem; border-bottom:1px solid var(--border); padding-bottom:.25rem; }
.from { font-size:.85rem; color:var(--muted); }
.from a { color:var(--accent); }
nav a[aria-current] { font-weight:700; text-decoration:none; }

.searchbox { width:100%; font-size:1.05rem; padding:.7rem .9rem; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); }
.chips { margin:.7rem 0; }
.chips button { background:#243044; color:var(--accent); border:1px solid var(--border); border-radius:999px; padding:.25rem .8rem; margin:.15rem .3rem .15rem 0; cursor:pointer; font-size:.85rem; }
.chips button[aria-pressed="true"] { background:var(--accent); color:#0f1419; }
mark { background:#ffd54a; color:#111; border-radius:2px; padding:0 .1em; }
#status { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<header>
  <h1>記事検索</h1>
  <p>過去のダイジェスト全記事（タイトル・本文）をブラウザ内で検索します。スペース区切りでAND検索。</p>
</header>
<nav class="site-nav">
  <a href="../">最新</a>
  <a href="../category/ai/">AI</a>
  <a href="../category/gadget/">ガジェット</a>
  <a href="../category/camera/">カメラ</a>
  <a href="../search/" aria-current="page">検索</a>
  <a href="../archive/">アーカイブ</a>
</nav>
<main>
<input id="q" class="searchbox" type="search" placeholder="例: OpenAI / iPhone / ソニー" autocomplete="off" autofocus>
<div class="chips" id="chips">
  <button type="button" data-cat="" aria-pressed="true">すべて</button>
  <button type="button" data-cat="ai" aria-pressed="false">AI</button>
  <button type="button" data-cat="gadget" aria-pressed="false">ガジェット</button>
  <button type="button" data-cat="camera" aria-pressed="false">カメラ</button>
</div>
<p id="status">読み込み中…</p>
<div id="results"></div>
</main>
<footer><p>データ: <a href="../data/articles.json">data/articles.json</a>（scripts/build_index.py で生成）</p></footer>
<script src="search.js"></script>
</body>
</html>
